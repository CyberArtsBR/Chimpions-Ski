name: Render pipeline branch validation

on:
  push:
    branches:
      - feat/ski-render-max-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Syntax validation
        run: |
          node --check src/main.js
          node --check src/renderQuality.js
          node --check src/renderPipeline.js
          node --check scripts/benchmark/core.mjs
          node --check scripts/compare-performance-results.mjs
      - name: Rendering and visual invariants
        run: |
          node checks/performance-quality-invariants.mjs
          node checks/blue-bloom-invariants.mjs
          npm run check:performance
          node checks/rider-pose-invariants.mjs
          node checks/mountain-visual-invariants.mjs
          node checks/powder-snow-invariants.mjs
          node checks/avatar-compatibility-invariants.mjs
      - run: npm run build
      - run: node checks/assets.mjs
      - run: npx playwright install --with-deps chromium
      - name: Rendering browser profile and lifecycle probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render-benchmarks
          npm run preview -- --host 127.0.0.1 > /tmp/chimpions-render-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true; wait $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-render-preview.log || true; exit 1; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {chromium} from '@playwright/test';

          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({
            viewport:{width:240,height:135},
            deviceScaleFactor:2
          });
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',error=>errors.push('PAGEERROR '+(error?.message||String(error))));
          page.on('console',message=>{if(message.type()==='error')errors.push('CONSOLE '+message.text());});

          const percentile=(values,p)=>{
            const sorted=[...values].sort((a,b)=>a-b);
            if(!sorted.length)return null;
            const index=(sorted.length-1)*p;
            const lo=Math.floor(index),hi=Math.ceil(index);
            return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(index-lo);
          };
          const round=value=>value==null?null:Math.round(value*1000)/1000;

          await page.goto('http://127.0.0.1:4173/?test=1&quality=low',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>typeof window.chimpionsSki==='function'&&window.chimpionsSki()?.qualityProfile,null,{timeout:30000});
          await page.waitForFunction(()=>window.chimpionsSki?.().ready===true,null,{timeout:30000});

          const staticBefore=await page.evaluate(()=>window.chimpionsSki());
          await page.waitForTimeout(350);
          const staticAfter=await page.evaluate(()=>window.chimpionsSki());

          await page.evaluate(()=>{
            const start=document.querySelector('.start-screen');
            if(start)start.hidden=true;
            document.body.classList.remove('start-screen-active');
          });
          await page.waitForTimeout(120);

          async function switchTo(target){
            for(let guard=0;guard<8;guard++){
              const current=await page.evaluate(()=>window.chimpionsSki().qualityMode);
              if(current===target)return;
              await page.locator('#quality-profile').evaluate(button=>button.click());
              await page.waitForTimeout(90);
            }
            assert.equal(await page.evaluate(()=>window.chimpionsSki().qualityMode),target,'failed to switch quality to '+target);
          }

          async function collectFrameTimes(durationMs=500){
            return page.evaluate(duration=>new Promise(resolve=>{
              const values=[];
              let last=performance.now();
              const began=last;
              let settled=false;
              const finish=()=>{
                if(settled)return;
                settled=true;
                resolve(values.slice(1));
              };
              const timeout=setTimeout(finish,duration+750);
              const tick=stamp=>{
                if(settled)return;
                values.push(stamp-last);
                last=stamp;
                if(stamp-began>=duration){
                  clearTimeout(timeout);
                  finish();
                }else requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            }),durationMs);
          }

          const results={};
          for(const profile of ['low','high','max','medium']){
            await switchTo(profile);
            await page.waitForTimeout(180);
            const frameTimes=await collectFrameTimes();
            const d=await page.evaluate(()=>window.chimpionsSki());
            results[profile]={
              frameP50Ms:round(percentile(frameTimes,.50)),
              frameP95Ms:round(percentile(frameTimes,.95)),
              frameP99Ms:round(percentile(frameTimes,.99)),
              rendererCalls:d.rendererCalls,
              rendererTriangles:d.rendererTriangles,
              rendererGeometries:d.rendererGeometries,
              rendererTextures:d.rendererTextures,
              rendererPixelRatio:d.rendererPixelRatio,
              renderPipeline:d.renderPipeline,
              postProcessingEnabled:d.postProcessingEnabled,
              renderTargetType:d.renderTargetType,
              renderTargetSamples:d.renderTargetSamples,
              managedRenderTargetCount:d.managedRenderTargetCount,
              bloomEnabled:d.bloomEnabled,
              bloomStrength:d.bloomStrength,
              bloomThreshold:d.bloomThreshold,
              shadowEnabled:d.shadowEnabled,
              shadowMapSize:d.shadowMapSize,
              anisotropyRequested:d.anisotropyRequested,
              activeDecorativeTrees:d.activeDecorativeTrees,
              activeBanks:d.activeBanks,
              activeWindBanks:d.activeWindBanks
            };
          }

          assert.equal(errors.length,0,'browser errors: '+errors.join(' | '));
          assert.equal(results.low.renderPipeline,'direct','LOW must bypass composer');
          assert.equal(results.low.postProcessingEnabled,false,'LOW still pays for post processing');
          assert.equal(results.low.bloomEnabled,false,'LOW still pays for bloom');
          assert.equal(results.low.shadowEnabled,false,'LOW still pays for realtime shadows');
          assert.equal(results.medium.shadowEnabled,false,'MEDIUM unexpectedly enables realtime shadows');
          assert.equal(results.max.renderPipeline,'composer');
          assert.equal(results.max.bloomEnabled,true);
          assert.equal(results.max.shadowEnabled,true);
          assert(results.max.shadowMapSize>results.high.shadowMapSize,'MAX shadow quality does not exceed HIGH');
          assert(results.max.renderTargetSamples>results.high.renderTargetSamples,'MAX MSAA does not exceed HIGH');
          assert(results.high.renderTargetSamples>results.medium.renderTargetSamples,'HIGH MSAA does not exceed MEDIUM');
          assert(results.max.rendererPixelRatio>results.high.rendererPixelRatio,'MAX DPR does not exceed HIGH');
          assert(results.high.rendererPixelRatio>results.medium.rendererPixelRatio,'HIGH DPR does not exceed MEDIUM');
          assert(results.medium.rendererPixelRatio>results.low.rendererPixelRatio,'MEDIUM DPR does not exceed LOW');
          assert(results.max.activeDecorativeTrees>results.high.activeDecorativeTrees,'MAX environment density does not exceed HIGH');
          assert(results.high.activeDecorativeTrees>results.medium.activeDecorativeTrees,'HIGH environment density does not exceed MEDIUM');
          assert(results.medium.activeDecorativeTrees>results.low.activeDecorativeTrees,'MEDIUM environment density does not exceed LOW');

          await switchTo('max');
          await page.waitForTimeout(220);
          const before=await page.evaluate(()=>window.chimpionsSki());
          for(const target of ['medium','low','high','max','medium','low','high','max']){
            await switchTo(target);
            await page.waitForTimeout(100);
          }
          const after=await page.evaluate(()=>window.chimpionsSki());
          assert(after.pipelineRebuilds>before.pipelineRebuilds,'quality switching did not rebuild render targets');
          assert(after.targetDisposals>before.targetDisposals,'quality switching did not dispose replaced render targets');
          assert.equal(after.managedRenderTargetCount,before.managedRenderTargetCount,'render-target count changed after returning to MAX');
          assert(after.rendererGeometries<=before.rendererGeometries+2,'quality switching leaked geometries');
          assert(after.rendererTextures<=before.rendererTextures+4,'quality switching leaked textures');

          results.staticStart={
            beforeSkips:staticBefore.staticFrameSkips,
            afterSkips:staticAfter.staticFrameSkips,
            beforeRendered:staticBefore.staticFramesRendered,
            afterRendered:staticAfter.staticFramesRendered
          };
          results.telemetry={
            gpuTimerSupported:after.gpuTimerSupported,
            gpuFrameP50Ms:after.gpuFrameP50Ms,
            gpuFrameP95Ms:after.gpuFrameP95Ms,
            gpuFrameP99Ms:after.gpuFrameP99Ms,
            renderCpuP50Ms:after.renderCpuP50Ms,
            renderCpuP95Ms:after.renderCpuP95Ms,
            renderCpuP99Ms:after.renderCpuP99Ms,
            postProcessCpuP95Ms:after.postProcessCpuP95Ms
          };
          results.lifecycle={
            before:{
              rendererGeometries:before.rendererGeometries,
              rendererTextures:before.rendererTextures,
              managedRenderTargetCount:before.managedRenderTargetCount,
              pipelineRebuilds:before.pipelineRebuilds,
              targetDisposals:before.targetDisposals
            },
            after:{
              rendererGeometries:after.rendererGeometries,
              rendererTextures:after.rendererTextures,
              managedRenderTargetCount:after.managedRenderTargetCount,
              pipelineRebuilds:after.pipelineRebuilds,
              targetDisposals:after.targetDisposals
            }
          };

          writeFileSync('render-benchmarks/render-profile-probe.json',JSON.stringify(results,null,2)+'\n');
          console.log('RENDER_PROFILE_PROBE '+JSON.stringify(results));
          await context.close();
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-pipeline-profile-probe
          path: render-benchmarks/*.json
          if-no-files-found: warn
