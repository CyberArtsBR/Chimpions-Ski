name: Chimpions Ski desktop build and checks
on:
  push:
    branches: [main, integration/ski-definitive-super-enhancement-final]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: node checks/assets.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run desktop browser audit and production crowd benchmark
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/chimpions-ski-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/?test=1 >/dev/null; then break; fi
            sleep 1
          done
          node checks/desktop-browser.mjs
          npm run smoke:production
          CHIMPIONS_SKI_CROWD_RESTARTS=2 CHIMPIONS_SKI_CROWD_FULL_TIMEOUT_MS=60000 npm run benchmark:crowd
