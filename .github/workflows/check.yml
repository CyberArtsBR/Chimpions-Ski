name: Chimpions Ski desktop build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: node checks/assets.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run local desktop browser audit and release smoke
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/chimpions-ski-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/?test=1 >/dev/null; then break; fi
            if [ "$i" = 60 ]; then cat /tmp/chimpions-ski-vite.log || true; exit 1; fi
            sleep 1
          done
          node checks/desktop-browser.mjs
          npm run smoke:production
