name: Ski asset pipeline

on:
  push:
    branches:
      - perf/ski-asset-pipeline
  pull_request:
    branches:
      - main
    paths:
      - "public/model/characters/**"
      - "public/avatars.json"
      - "public/characters.json"
      - "src/skier.js"
      - "src/main.js"
      - "scripts/assets-*.mjs"
      - "scripts/lib/asset-audit.mjs"
      - "checks/asset-pipeline-invariants.mjs"
      - "checks/avatar-asset-browser.mjs"
      - "config/asset-budgets.json"
      - "reports/assets/**"
      - "package.json"
      - ".github/workflows/asset-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ski-asset-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asset-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Optimize production GLBs
        if: github.event_name == 'push' && github.ref == 'refs/heads/perf/ski-asset-pipeline' && !contains(github.event.head_commit.message, '[asset-optimize]')
        env:
          ASSET_MIN_SAVINGS_PCT: "1.5"
          ASSET_MIN_TOTAL_SAVINGS_PCT: "2"
        run: npm run assets:optimize

      - name: Verify production asset contract
        run: npm run assets:verify

      - name: Full repository checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Canonical roster check
        run: node checks/assets.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser asset and local-GLB validation
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-asset-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-asset-preview.log || true; exit 1; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node checks/production-smoke.mjs
          BASE_URL=http://127.0.0.1:4173 node checks/avatar-asset-browser.mjs

      - name: Commit measured optimized assets back to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/perf/ski-asset-pipeline' && !contains(github.event.head_commit.message, '[asset-optimize]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/model/characters config/asset-budgets.json reports/assets
          if git diff --cached --quiet; then
            echo "No optimized asset changes to commit."
            exit 0
          fi
          git commit -m "Optimize Chimpion production assets [asset-optimize] [skip ci]"
          git push origin HEAD:perf/ski-asset-pipeline
