name: Stage 2 Hazard Visual Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    if: github.head_ref == 'feat/ski-stage2-hazard-visuals' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:visual
      - run: npm run check:integration
      - run: npm run check:performance
