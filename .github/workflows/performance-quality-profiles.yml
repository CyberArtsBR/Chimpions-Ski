name: Performance quality profiles

on:
  push:
    branches:
      - integration/ski-full-audit-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 2cccdfa62de98ec44870103e842efc5a71d09497
      BENCH_ENV: "VIEWPORT_WIDTH=960 VIEWPORT_HEIGHT=600 READY_TIMEOUT_MS=90000 GAMEPLAY_SECONDS=15 LONG_RUN_SECONDS=20 MODE_RUN_SECONDS=5 TRICK_RUN_SECONDS=5 RESTART_ITERATIONS=1 SELECTOR_ITERATIONS=1 SAMPLE_INTERVAL_MS=500"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install

      - name: Stage 2 visual checks
        run: npm run check:visual

      - name: Stage 2 performance checks
        run: npm run check:performance

      - name: Stage 2 production build
        run: npm run build

      - name: Full existing check
        id: fullcheck
        continue-on-error: true
        run: npm run check

      - run: npx playwright install --with-deps chromium

      - name: Prepare baseline build
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          git worktree add --detach /tmp/chimpions-ski-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chimpions-ski-base/node_modules
          (cd /tmp/chimpions-ski-base && npm run build)

      - name: Benchmark baseline HIGH
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          start_preview () {
            local dir="$1"
            local log="$2"
            (cd "$dir" && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >"$log" 2>&1 &
            PREVIEW_PID=$!
          }
          stop_preview () {
            kill "$PREVIEW_PID" 2>/dev/null || true
            wait "$PREVIEW_PID" 2>/dev/null || true
          }
          wait_preview () {
            for i in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/chimpions-base-preview.log || true
            return 1
          }
          start_preview /tmp/chimpions-ski-base /tmp/chimpions-base-preview.log
          trap stop_preview EXIT
          wait_preview
          env $BENCH_ENV QUALITY_PROFILE=high BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-baseline.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark baseline MAX
        id: baseline_max
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          start_preview () {
            local dir="$1"
            local log="$2"
            (cd "$dir" && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >"$log" 2>&1 &
            PREVIEW_PID=$!
          }
          stop_preview () {
            kill "$PREVIEW_PID" 2>/dev/null || true
            wait "$PREVIEW_PID" 2>/dev/null || true
          }
          wait_preview () {
            for i in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/chimpions-base-max-preview.log || true
            return 1
          }
          start_preview /tmp/chimpions-ski-base /tmp/chimpions-base-max-preview.log
          trap stop_preview EXIT
          wait_preview
          env $BENCH_ENV QUALITY_PROFILE=max BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-baseline-max.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark HIGH
        id: high
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-high-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-high-preview.log || true; exit 1; fi
            sleep 1
          done
          env $BENCH_ENV QUALITY_PROFILE=high BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-high.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark MAX
        id: max
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-max-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-max-preview.log || true; exit 1; fi
            sleep 1
          done
          env $BENCH_ENV QUALITY_PROFILE=max BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-max.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark LOW
        id: low
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-low-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-low-preview.log || true; exit 1; fi
            sleep 1
          done
          env $BENCH_ENV QUALITY_PROFILE=low BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-low.json" node scripts/benchmark-ski-runtime.mjs

      - name: Compare benchmark results
        id: compare
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          for file in benchmark-baseline.json benchmark-baseline-max.json benchmark-high.json benchmark-max.json benchmark-low.json; do
            test -s "benchmark-artifacts/$file"
          done
          node scripts/compare-performance-results.mjs \
            benchmark-artifacts/benchmark-baseline.json \
            benchmark-artifacts/benchmark-high.json \
            benchmark-artifacts/benchmark-low.json \
            benchmark-artifacts/benchmark-comparison.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-quality-benchmarks
          path: benchmark-artifacts/*.json
          if-no-files-found: warn

      - name: Enforce benchmark success
        if: always()
        env:
          FULLCHECK_OUTCOME: ${{ steps.fullcheck.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BASELINE_MAX_OUTCOME: ${{ steps.baseline_max.outcome }}
          HIGH_OUTCOME: ${{ steps.high.outcome }}
          MAX_OUTCOME: ${{ steps.max.outcome }}
          LOW_OUTCOME: ${{ steps.low.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "fullcheck=$FULLCHECK_OUTCOME baseline_high=$BASELINE_OUTCOME baseline_max=$BASELINE_MAX_OUTCOME high=$HIGH_OUTCOME max=$MAX_OUTCOME low=$LOW_OUTCOME compare=$COMPARE_OUTCOME"
          test "$BASELINE_OUTCOME" = success
          test "$BASELINE_MAX_OUTCOME" = success
          test "$HIGH_OUTCOME" = success
          test "$MAX_OUTCOME" = success
          test "$LOW_OUTCOME" = success
          test "$COMPARE_OUTCOME" = success
