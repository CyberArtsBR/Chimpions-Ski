name: Performance quality profiles

on:
  push:
    branches:
      - feature/ski-performance-quality-profiles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 924120cd81bc8d94eedf38a2423c55fdb861449d
      BENCH_ENV: "GAMEPLAY_SECONDS=15 LONG_RUN_SECONDS=25 MODE_RUN_SECONDS=10 TRICK_RUN_SECONDS=10 RESTART_ITERATIONS=1 SELECTOR_ITERATIONS=1 SAMPLE_INTERVAL_MS=500"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Benchmark baseline, HIGH and REDUCED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts

          run_preview () {
            local dir="$1"
            local log="$2"
            (cd "$dir" && npm run preview -- --host 127.0.0.1 >"$log" 2>&1 & echo $!)
          }

          wait_preview () {
            for i in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }

          stop_preview () {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          git worktree add --detach /tmp/chimpions-ski-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chimpions-ski-base/node_modules
          (cd /tmp/chimpions-ski-base && npm run build)
          BASE_PID=$(run_preview /tmp/chimpions-ski-base /tmp/chimpions-base-preview.log)
          trap 'stop_preview "$BASE_PID"' EXIT
          wait_preview
          env $BENCH_ENV BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-baseline.json" node scripts/benchmark-ski-runtime.mjs
          stop_preview "$BASE_PID"
          trap - EXIT

          HEAD_PID=$(run_preview "$GITHUB_WORKSPACE" /tmp/chimpions-head-preview.log)
          trap 'stop_preview "$HEAD_PID"' EXIT
          wait_preview
          env $BENCH_ENV QUALITY_PROFILE=high BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-high.json" node scripts/benchmark-ski-runtime.mjs
          env $BENCH_ENV QUALITY_PROFILE=reduced BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-reduced.json" node scripts/benchmark-ski-runtime.mjs
          stop_preview "$HEAD_PID"
          trap - EXIT

          node scripts/compare-performance-results.mjs \
            benchmark-artifacts/benchmark-baseline.json \
            benchmark-artifacts/benchmark-high.json \
            benchmark-artifacts/benchmark-reduced.json \
            benchmark-artifacts/benchmark-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-quality-benchmarks
          path: benchmark-artifacts/*.json
          if-no-files-found: error
