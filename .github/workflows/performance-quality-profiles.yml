name: Performance quality profiles

on:
  push:
    branches:
      - integration/ski-full-audit-fixes
      - fix/ski-ci-course-contract
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Optional comparison commit. Manual runs default to the retained historical anchor.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HISTORICAL_BASE_SHA: 744819df9486208e52dc9d922ce5732ec7c131b8
      # Keep push/PR regression coverage broad but bounded for software-WebGL CI.
      # Manual runs can still use the documented 300/600 second long-run windows.
      BENCH_ENV: "GAMEPLAY_SECONDS=15 LONG_RUN_SECONDS=30 MODE_RUN_SECONDS=10 TRICK_RUN_SECONDS=10 RESTART_ITERATIONS=1 SELECTOR_ITERATIONS=1 SAMPLE_INTERVAL_MS=1000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve comparison baseline
        shell: bash
        env:
          REQUESTED_BASE_SHA: ${{ github.event.inputs.baseline_sha }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BASE_SHA:-}" ]; then
            BASE_SHA="$REQUESTED_BASE_SHA"
            BASELINE_MODE="explicit"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE_REF"
            BASE_SHA="$(git merge-base HEAD "origin/$PR_BASE_REF")"
            BASELINE_MODE="pull-request-merge-base"
          elif [ "${{ github.event_name }}" = "push" ]; then
            git fetch --no-tags origin main
            BASE_SHA="$(git merge-base HEAD origin/main)"
            BASELINE_MODE="main-merge-base"
          else
            BASE_SHA="$HISTORICAL_BASE_SHA"
            BASELINE_MODE="historical-anchor"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "BASELINE_MODE=$BASELINE_MODE" >> "$GITHUB_ENV"
          {
            echo "### Performance baseline"
            echo "- mode: $BASELINE_MODE"
            echo "- baseline: `$BASE_SHA`"
            echo "- retained historical anchor: `$HISTORICAL_BASE_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Prepare baseline build
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          git worktree add --detach /tmp/chimpions-ski-base "$BASE_SHA"
          if [ -f /tmp/chimpions-ski-base/package-lock.json ]; then
            (cd /tmp/chimpions-ski-base && npm ci)
            BASE_DEPENDENCIES="baseline-lockfile"
          else
            # Legacy commits predate package-lock.json. Reuse the current locked
            # dependencies only when dependency declarations are identical;
            # script/metadata changes do not change the install graph.
            node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('package.json'));const b=JSON.parse(fs.readFileSync('/tmp/chimpions-ski-base/package.json'));const keys=['dependencies','devDependencies','optionalDependencies','peerDependencies'];for(const k of keys){if(JSON.stringify(a[k]||{})!==JSON.stringify(b[k]||{})){console.error('dependency manifest mismatch in '+k);process.exit(1)}}"
            ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chimpions-ski-base/node_modules
            BASE_DEPENDENCIES="current-lock-compatible-dependencies"
          fi
          export BASE_DEPENDENCIES
          (cd /tmp/chimpions-ski-base && npm run build)
          node -e "const fs=require('fs');fs.writeFileSync('benchmark-artifacts/baseline-metadata.json',JSON.stringify({head:process.env.GITHUB_SHA,baseline:process.env.BASE_SHA,mode:process.env.BASELINE_MODE,historicalAnchor:process.env.HISTORICAL_BASE_SHA,dependencies:process.env.BASE_DEPENDENCIES},null,2))"

      - name: Benchmark baseline
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          start_preview () {
            local dir="$1"
            local log="$2"
            (cd "$dir" && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >"$log" 2>&1 &
            PREVIEW_PID=$!
          }
          stop_preview () {
            kill "$PREVIEW_PID" 2>/dev/null || true
            wait "$PREVIEW_PID" 2>/dev/null || true
          }
          wait_preview () {
            for i in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/chimpions-base-preview.log || true
            return 1
          }
          start_preview /tmp/chimpions-ski-base /tmp/chimpions-base-preview.log
          trap stop_preview EXIT
          wait_preview
          env $BENCH_ENV BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-baseline.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark HIGH
        id: high
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-high-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-high-preview.log || true; exit 1; fi
            sleep 1
          done
          env $BENCH_ENV QUALITY_PROFILE=high BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-high.json" node scripts/benchmark-ski-runtime.mjs

      - name: Benchmark LOW
        id: low
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) >/tmp/chimpions-low-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/chimpions-low-preview.log || true; exit 1; fi
            sleep 1
          done
          env $BENCH_ENV QUALITY_PROFILE=low BASE_URL=http://127.0.0.1:4173 RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-low.json" node scripts/benchmark-ski-runtime.mjs

      - name: Compare benchmark results
        id: compare
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          for file in benchmark-baseline.json benchmark-high.json benchmark-low.json; do
            test -s "benchmark-artifacts/$file"
          done
          node scripts/compare-performance-results.mjs \
            benchmark-artifacts/benchmark-baseline.json \
            benchmark-artifacts/benchmark-high.json \
            benchmark-artifacts/benchmark-low.json \
            benchmark-artifacts/benchmark-comparison.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-quality-benchmarks
          path: benchmark-artifacts/*.json
          if-no-files-found: warn

      - name: Enforce benchmark success
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          HIGH_OUTCOME: ${{ steps.high.outcome }}
          LOW_OUTCOME: ${{ steps.low.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "baseline=$BASELINE_OUTCOME high=$HIGH_OUTCOME low=$LOW_OUTCOME compare=$COMPARE_OUTCOME"
          test "$BASELINE_OUTCOME" = success
          test "$HIGH_OUTCOME" = success
          test "$LOW_OUTCOME" = success
          test "$COMPARE_OUTCOME" = success
