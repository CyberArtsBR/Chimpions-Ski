name: Import exact Chimp Jump music

on:
  push:
    branches:
      - feature/ski-audio-presentation-pass

permissions:
  contents: write

jobs:
  import-music:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact source artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1bb4-820e-b9fe-aa748fb01b72/raw?se=2026-09-22T20%3A23%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=fc123c78-9116-5d39-a22c-755c83e176ac&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T17%3A40%3A05Z&ske=2026-09-23T17%3A40%3A05Z&sks=b&skv=2026-02-06&sig=PS/rkO2Aj4mf7La8QN5qDHLfchHgSkdBIdJF3yZTL8U%3D' -o /tmp/chimp-jump-music.zip
          mkdir -p public/audio
          unzip -o /tmp/chimp-jump-music.zip -d public/audio
          test "$(git hash-object public/audio/music-full.mp3)" = "9606f2230f5a3b78fb7f9517b80014132205ec52"
          ls -lh public/audio/music-full.mp3
      - name: Commit exact local music asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/music-full.mp3
          git commit -m "Add local Chimp Jump music asset [skip ci]"
          git push
